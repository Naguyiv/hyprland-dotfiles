$terminal = alacritty
$fileManager = nemo
$menu = rofi -show drun # TEMP
$mainMod = ALT
$browser = firefox
$launch = SUPER

exec-once = $terminal 
exec-once = quickshell 
exec-once = hypridle hyprlock

env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct

env = XDG_DATA_DIRS,/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

#GTK_THEME
#XCURSOR_THEME
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    border_size = 2

    gaps_in = 7
    gaps_out = 7 
    gaps_workspaces = 0 

    col.inactive_border = 0xff444444
    col.active_border = 0xffffffff

    #col.nogroup_border
    #col.nogroup_border_active

    layout = dwindle
    no_focus_fallback = false

    resize_on_border = true
    resize_corner = 0
    extend_border_grab_area = 15
    hover_icon_on_border = true

    allow_tearing = false
    modal_parent_blocking = true
    #locale

    snap {
        enabled = true
        window_gap = 10 
        monitor_gap = 10 

        border_overlap = false
        respect_gaps = true
    }

}

decoration {
    rounding = 10
    rounding_power = 4.0

    active_opacity = 0.9
    fullscreen_opacity = 1
    inactive_opacity = 0.93

    dim_modal = false
    dim_inactive = false
    dim_strength = 0.5
    dim_special = 0.2
    dim_around = 0.4

    #screen_shader = ""
    border_part_of_window = true

    blur {
        enabled = true
        ignore_opacity = true
        new_optimizations = true
        
        size = 1
        passes = 1
        noise = 0.0117
        contrast = 1
        brightness = 0.8
        vibrancy = 0.1696
        vibrancy_darkness = 0.0

        special = false
        popups = false
        popups_ignorealpha = 0.2
        input_methods = false
        input_methods_ignorealpha = 0.2
        xray = false
    }

    shadow {
        enabled = true 

        range = 4
        render_power = 3

        sharp = false
        #ignore_window = true
        
        color = 0xee1a1a1a 
        #color_inactive = unset
        offset = 0 0 
        scale = 1.0
    }
}

animations {
    enabled = true
    workspace_wraparound = false 

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = easeOutCirc,    0,    0.55, 0.45, 1
    bezier = easeOutBack,    0.34, 1.56, 0.64, 1
    bezier = easeInOutExpo,  0.87, 0,    0.13, 1
    bezier = overshoot, 0.05, 0.9, 0.1, 1.1
    
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick


}

input {


    touchpad {

    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    col.splash = 0xffffffff
    font_family = sans
    force_default_wallpaper = 0
    #vfr = true

    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    disable_autoreload = false
    enable_swallow = false

    focus_on_activate = true
    mouse_move_focuses_monitor = true
    allow_session_lock_restore = true
    background_color = 0x111111 
    close_special_on_empty = true
    on_focus_under_fullscreen = 2

    initial_workspace_tracking = 1
    middle_click_paste = false
}

layout {
    single_window_aspect_ratio = 0 0 
}

binds {
    workspace_back_and_forth = true
    movefocus_cycles_groupfirst = true
    disable_keybind_grabbing = true
}

ecosystem {
    enforce_permissions = false
}
gesture = 3, horizontal, workspace
gesture = 3, up, fullscreen
gesture = 3, down, mod: ALT, close
gesture = 4, up, special

gesture = 3, left, mod: CTRL, move
gesture = 3, right, mod: CTRL, move
gesture = 3, up, mod: CTRL, move
gesture = 3, down, mod: CTRL, move

gesture = 3, left, mod: ALT, resize
gesture = 3, right, mod: ALT, resize
gesture = 3, up, mod: ALT, resize

gesture = 2, pinchin, mod: ALT, cursorZoom

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $browser
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, S, exec, $menu
bind = $mainMod, F, fullscreen, toggle

bind = SUPER, SUPER_L , exec, hyprctl dispatch global quickshell:Launchpad
bind = $mainMod SHIFT, equal, exec, grim -g "$(slurp)" - | wl-copy

bind = $mainMod, L, exec, hyprlock -c ~/hyprland-dotfiles/config/.config/hypr/hyprlock.conf

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

layerrule {
    name = quickshell-blur
    match:namespace = dock
    blur = on
    ignore_alpha = 0
}
